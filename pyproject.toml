[project]
name = "stock-desktop"
version = "0.1.0"
description = "Dashboard de ações B3 para desktop Ubuntu/GNOME"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
stock-desktop = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
